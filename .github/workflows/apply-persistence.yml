name: Apply Transaction Persistence
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add offline transaction persistence
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/riyaz/rssmoneymanager/MainActivity.kt')
          s=p.read_text()
          s=s.replace('import java.util.Locale\n', 'import java.util.Locale\nimport org.json.JSONArray\nimport org.json.JSONObject\n')
          s=s.replace('        renderDashboard()\n        renderTransactions()\n', '        loadPersistedState()\n        renderDashboard()\n        renderTransactions()\n', 1)
          s=s.replace('                renderDashboard()\n                renderTransactions()\n                dialog.dismiss()', '                savePersistedState()\n                renderDashboard()\n                renderTransactions()\n                dialog.dismiss()', 1)
          marker='    private fun renderDashboard() {'
          methods='''    private fun savePersistedState() {
        val prefs = getSharedPreferences("money_manager_state", MODE_PRIVATE)
        val root = JSONObject().apply {
            put("balanceMinor", balanceMinor)
            put("incomeMinor", incomeMinor)
            put("expenseMinor", expenseMinor)
            put("transactions", JSONArray().also { array ->
                recentTransactions.forEach { tx ->
                    array.put(JSONObject().apply {
                        put("type", tx.type)
                        put("count", tx.count)
                        put("unitMinor", tx.unitMinor)
                        put("totalMinor", tx.totalMinor)
                        put("description", tx.description)
                        put("category", tx.category)
                        put("wallet", tx.wallet)
                        put("memo", tx.memo)
                        put("recurring", tx.recurring)
                        put("items", JSONArray().also { items -> tx.items.forEach { item ->
                            items.put(JSONObject().apply {
                                put("name", item.name)
                                put("quantity", item.quantity)
                                put("unitMinor", item.unitMinor)
                                put("totalMinor", item.totalMinor)
                            })
                        } })
                    })
                }
            })
        }
        prefs.edit().putString("state", root.toString()).apply()
    }

    private fun loadPersistedState() {
        val raw = getSharedPreferences("money_manager_state", MODE_PRIVATE).getString("state", null) ?: return
        try {
            val root = JSONObject(raw)
            balanceMinor = root.optLong("balanceMinor", 0L)
            incomeMinor = root.optLong("incomeMinor", 0L)
            expenseMinor = root.optLong("expenseMinor", 0L)
            recentTransactions.clear()
            val array = root.optJSONArray("transactions") ?: return
            for (i in 0 until array.length()) {
                val tx = array.getJSONObject(i)
                val items = mutableListOf<TransactionItem>()
                val itemArray = tx.optJSONArray("items")
                if (itemArray != null) for (j in 0 until itemArray.length()) {
                    val item = itemArray.getJSONObject(j)
                    items.add(TransactionItem(item.optString("name"), item.optLong("quantity", 1L), item.optLong("unitMinor", 0L), item.optLong("totalMinor", 0L)))
                }
                recentTransactions.add(Transaction(tx.optString("type"), tx.optLong("count", 1L), tx.optLong("unitMinor", 0L), tx.optLong("totalMinor", 0L), tx.optString("description"), tx.optString("category"), tx.optString("wallet"), tx.optString("memo"), items, tx.optBoolean("recurring", false)))
            }
        } catch (_: Exception) {
            recentTransactions.clear()
            balanceMinor = 0L
            incomeMinor = 0L
            expenseMinor = 0L
        }
    }

'''
          if 'private fun savePersistedState()' not in s:
              s=s.replace(marker, methods+marker, 1)
          s=s.replace('    override fun onDestroy() { _binding = null; super.onDestroy() }', '    override fun onDestroy() { savePersistedState(); _binding = null; super.onDestroy() }')
          p.write_text(s)
          PY
      - name: Commit persistence implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riyaz/rssmoneymanager/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat: persist transactions locally across app restarts'
          git push
