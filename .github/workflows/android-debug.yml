name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug --stacktrace

      - name: Capture Gradle diagnostics on failure
        if: failure()
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleDebug --stacktrace --info > build-failure.log 2>&1 || true

      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rss-money-manager-build-failure-diagnostics
          path: build-failure.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-money-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: RSS Money Manager Debug Build ${{ github.run_number }}
          body: |
            Automatic debug APK build from commit ${{ github.sha }}.

            This release was created automatically by GitHub Actions.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
          prerelease: true
          make_latest: false
