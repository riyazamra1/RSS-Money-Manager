# Project-wide Gradle settings.

# RSS AUTO / low-memory Oracle build profile.
# The Oracle host has about 1 GB RAM, so avoid a persistent Gradle daemon.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx192m -XX:MaxMetaspaceSize=128m

# AndroidX package structure.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Reduce generated R-class coupling.
android.nonTransitiveRClass=true
