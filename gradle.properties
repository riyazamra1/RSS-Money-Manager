# Project-wide Gradle settings.
# IDE (e.g. Android Studio):
# IDE settings may override these values.

# RSS AUTO / low-memory Oracle build profile.
# Keep the Gradle daemon below the host's ~1 GB RAM ceiling.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx256m -XX:MaxMetaspaceSize=192m

# AndroidX package structure.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Reduce generated R-class coupling.
android.nonTransitiveRClass=true
